{% load wagtailimages_tags i18n %}

<div>
  <div class="interactive-anatomy">
    <h2 class="font-serif text-4xl md:text-5xl lg:text-6xl font-bold text-foreground mb-8">
      <span style="text-wrap: balance">{{ value.title }}</span>
    </h2>
    <div class="interactive-wrapper">
      <svg
        class="responsive-svg"
        viewBox="0 0 690 362"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
      >
        {# The image shares the viewBox coordinates so the hotspots stay aligned at every size. #}
        {% image value.image width-1140 as img %}
        <image
          href="{{ img.url }}"
          x="0"
          y="0"
          width="690"
          height="362"
          preserveAspectRatio="xMidYMid meet"
        >
          <title>{{ value.title }}</title>
        </image>
        <g class="ca-interactive-images-container-left-item">
          <circle
            class="ca-interactive-images-container-left-item-circle"
            cx="390"
            cy="70"
            fill="darkblue"
            r="7"
          ></circle>
          <circle
            class="ca-interactive-images-container-left-item-blur"
            cx="390"
            cy="70"
            r="13.5"
            stroke="darkblue"
          ></circle>
          <line
            class="ca-interactive-images-container-left-item-line"
            stroke="white"
            x1="250"
            x2="450"
            y1="30"
            y2="30"
          ></line>
          <line
            class="ca-interactive-images-container-left-item-line"
            stroke="white"
            x1="390"
            x2="390"
            y1="57"
            y2="30"
          ></line>
          <text
            class="ca-interactive-images-container-left-item-text"
            fill="white"
            font-size="14"
            letter-spacing="0px"
            style="white-space: pre"
            xml:space="preserve"
          >
            <tspan x="250" y="25">{% trans "Dorsal Fin" %}</tspan>
          </text>
        </g>
